  default_importance: "medium"
  priority_rules:
    high:
      source_priority:
        - "high"
      source_types:
        - "implementation_guides"
        - "enterprise_genai_platform"
        - "production_architecture_check"
        - "company_strategy"
        - "genai_architecture"
      topic_keywords:
        - "agent"
        - "RAG"
        - "enterprise"
        - "production"
        - "governance"
        - "智能体"
        - "生产级"
    medium:
      source_priority:
        - "medium"
      source_types:
        - "ai_ml_practice_blog"
        - "product_releases"
        - "executive_insights"
    low:
      source_priority:
        - "low"
