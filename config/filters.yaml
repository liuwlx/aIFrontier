filters:
  accept_keywords:
    - "AI"
    - "artificial intelligence"
    - "generative AI"
    - "GenAI"
    - "LLM"
    - "agent"
    - "RAG"
    - "machine learning"
    - "data platform"
    - "architecture"
    - "whitepaper"
    - "大模型"
    - "生成式 AI"
    - "智能体"
    - "人工智能"
    - "机器学习"
    - "数据平台"
    - "架构"
    - "白皮书"
  reject_keywords:
    - "coupon"
    - "discount"
    - "celebrity"
    - "娱乐八卦"
